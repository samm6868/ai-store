name: AI Store Auto-Pilot

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-store:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run AI Product Hunter
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python ai_agent.py

      - name: Commit and Push Daily Updates
        run: |
          git config --global user.name "AI Store Bot"
          git config --global user.email "bot@trendify-ai.com"
          git add products.json feed.xml product-*.html
          git commit -m "🤖 Daily AI Store & Marketing Feed Update" || exit 0
          git pull --rebase origin main || true
          git push origin main
